name: sachiel
description: A Trading Signals Platform for Cryptocurrency, Forex & More

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependency_overrides:
  fading_edge_scrollview: ^4.1.1

dependencies:
  flutter:
    sdk: flutter

  age_range_signals: ^0.10.1
  app_settings: ^9.0.1

  back_button_interceptor: any
  blur: any

  cached_network_image: any
  connectivity_plus: any
  cloud_firestore: any
  cloud_functions: any
  cupertino_icons: any
  currency_text_input_formatter: any

  firebase_core: ^5.2.0
  firebase_app_check: any
  firebase_analytics: any
  firebase_crashlytics: any
  firebase_auth: any
  firebase_database: any
  firebase_remote_config: any
  firebase_messaging: any
  firebase_in_app_messaging: any
  flutter_html: any
  flutter_local_notifications: any
  flutter_phoenix: any
  flutter_slidable: any
  fluttertoast: ^10.0.3

  google_sign_in: any
  http: any
  in_app_purchase: any
  liquid_swipe: any
  loading_animation_widget: any
  local_auth: any
  marquee: any
  path_provider: any
  permission_handler: any
  quick_actions: any
  share_plus: ^13.3.1
  url_launcher: any
  widget_mask: any
  win32: any

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/

  fonts:
    - family: Ubuntu
      fonts:
        - asset: fonts/ubuntu.ttf
    - family: Handwriting
      fonts:
        - asset: fonts/waterfall.ttf
    - family: Electric
      fonts:
        - asset: fonts/electric.ttf